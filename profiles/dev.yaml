# Development only: a stand-in engine that transliterates instead of translating,
# so the UI and pipeline can be exercised without downloading any model.
name: dev
label: "Developer (stand-in engine, NOT a real translation)"
ram_budget_gb: 2
cpu_threads: auto
default_choice: auto
choices:
  auto: dev-standin-llm
  fast: null
  balanced: dev-standin-llm
  best: dev-standin-llm
step_down: [dev-standin-llm]
quick_draft_model: dev-standin-draft
low_memory_draft_model: dev-standin-draft
llm:
  ctx: 4096
  temperature: 0.2
  paragraph_max_sentences: 10
  timeout_s_per_sentence: 30
limits: { max_mb: 50, max_pages: 100, retention_days: 30 }
